<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Recuperar Contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 380px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #1e88e5; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Recuperar Cuenta</h2>
        <input type="email" id="email" placeholder="ejemplo@correo.com">
        <button onclick="enviar()">Enviar Enlace</button>
        <div id="msg" style="margin-top:20px; color:green;"></div>
    </div>
    <script>
        async function enviar() {
            const email = document.getElementById('email').value;
            const res = await fetch('http://localhost:8080/api/auth/recuperar', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({correo: email})
            });
            const data = await res.json();
            document.getElementById('msg').innerText = data.mensaje;
        }
    </script>
</body>
</html>
