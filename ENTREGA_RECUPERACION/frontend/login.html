<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>StudyHub - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        button { width: 100%; padding: 14px; background: #1e88e5; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .forgot { display: block; margin-top: 20px; color: #1e88e5; text-decoration: none; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h2>StudyHub Login</h2>
        <input type="email" placeholder="Correo" style="width:100%; padding:12px; margin-bottom:15px; border-radius:10px; border:1px solid #ddd;">
        <input type="password" placeholder="Contraseña" style="width:100%; padding:12px; margin-bottom:20px; border-radius:10px; border:1px solid #ddd;">
        <button>Ingresar</button>
        <a href="recuperar.html" class="forgot">¿Olvidaste tu contraseña?</a>
    </div>
</body>
</html>
