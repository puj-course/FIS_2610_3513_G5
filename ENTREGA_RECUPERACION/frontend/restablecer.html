<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Nueva Contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 380px; text-align: center; }
        input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #16a34a; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Nueva Contraseña</h2>
        <input type="password" id="p1" placeholder="Nueva contraseña">
        <input type="password" id="p2" placeholder="Confirmar contraseña">
        <button onclick="cambiar()">Guardar Cambios</button>
    </div>
    <script>
        async function cambiar() {
            const p1 = document.getElementById('p1').value;
            const token = new URLSearchParams(window.location.search).get('token');
            const res = await fetch('http://localhost:8080/api/auth/restablecer', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: token, nuevaPassword: p1})
            });
            if(res.ok) { alert("¡Contraseña actualizada!"); window.location.href = 'login.html'; }
            else { alert("Error al actualizar"); }
        }
    </script>
</body>
</html>
