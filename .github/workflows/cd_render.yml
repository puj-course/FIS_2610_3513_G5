name: Continuous Deployment (Render)

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Despliegue disparado en Render."

  healthcheck:
    name: Health Check & Notification
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Boot & Verify Health
        run: |
          URL="${{ secrets.RENDER_SERVICE_URL }}/actuator/health"
          echo "Verificando salud en: $URL"
          
          # Esperar un tiempo inicial para que Render empiece el proceso
          sleep 60
          
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          until $(curl --output /dev/null --silent --head --fail "$URL"); do
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "Healthcheck FALLIDO después de varios intentos."
              exit 1
            fi
            
            echo "Esperando a que el servidor responda... (Intento $((RETRY_COUNT+1)))"
            sleep 30
            RETRY_COUNT=$((RETRY_COUNT+1))
          done
          
          echo "Healthcheck EXITOSO: El servidor está ARRIBA."

      - name: Send Telegram Notification (Success)
        if: success()
        run: |
          MESSAGE="✅ *StudyHub CI/CD Alert*%0A%0ADespliegue exitoso en Render! 🚀%0AEl servidor está UP y funcionando.%0A%0AURL: ${{ secrets.RENDER_SERVICE_URL }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=markdown"

      - name: Send Telegram Notification (Failure)
        if: failure()
        run: |
          MESSAGE="❌ *StudyHub CI/CD Alert*%0A%0AEl despliegue en Render ha FALLADO o el healthcheck no respondió.%0A%0AFavor revisar los logs en GitHub Actions."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=markdown"
