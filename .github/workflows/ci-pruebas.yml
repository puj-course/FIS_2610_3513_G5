name: CI - Pruebas Unitarias

on:
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    name: Ejecutar Pruebas Unitarias
    runs-on: ubuntu-22.04

    steps:
      # Obtener el código del repositorio
      - name: Checkout código
        uses: actions/checkout@v4

      # Configurar Java 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Correr las pruebas unitarias y verificar cobertura (JaCoCo check)
      - name: Ejecutar pruebas y verificar cobertura (70%)
        run: mvn clean verify --file src/Back-end/pom.xml --batch-mode --no-transfer-progress

      # Generar reporte HTML con los resultados (Surefire)
      - name: Generar reporte HTML Surefire
        if: always()
        run: mvn surefire-report:report --file src/Back-end/pom.xml --batch-mode --no-transfer-progress -DskipTests

      # Extraer métricas de cobertura de JaCoCo para el reporte
      - name: Extraer resumen de cobertura
        if: always()
        id: coverage-summary
        run: |
          JACOCO_XML="src/Back-end/target/site/jacoco/jacoco.xml"
          if [ -f "$JACOCO_XML" ]; then
            # Extraer líneas totales y cubiertas (usando tail -1 para el resumen global)
            LINE_MISSED=$(grep -oP 'counter type="LINE" missed="\K[0-9]+' "$JACOCO_XML" | tail -1)
            LINE_COVERED=$(grep -oP 'counter type="LINE" missed="[0-9]+" covered="\K[0-9]+' "$JACOCO_XML" | tail -1)
            TOTAL=$((LINE_MISSED + LINE_COVERED))
            PERCENTAGE=$(echo "scale=2; $LINE_COVERED * 100 / $TOTAL" | bc)
            echo "COVERAGE=$PERCENTAGE%" >> $GITHUB_OUTPUT
            echo "COVERAGE_VAL=$PERCENTAGE" >> $GITHUB_OUTPUT
          else
            echo "COVERAGE=N/A" >> $GITHUB_OUTPUT
          fi

      # Construir reporte HTML enriquecido
      - name: Construir resumen HTML
        if: always()
        run: |
          REPORT_DIR="src/Back-end/target/surefire-reports"
          OUTPUT="src/Back-end/target/reporte-pruebas.html"
          COVERAGE_STR="${{ steps.coverage-summary.outputs.COVERAGE }}"

          TOTAL_T=0; PASSED=0; FAILED=0; SKIPPED=0; ERRORS=0

          if [ -d "$REPORT_DIR" ]; then
            for xml in "$REPORT_DIR"/TEST-*.xml; do
              [ -f "$xml" ] || continue
              t=$(grep -oP 'tests="\K[0-9]+' "$xml" | head -1)
              f=$(grep -oP 'failures="\K[0-9]+' "$xml" | head -1)
              s=$(grep -oP 'skipped="\K[0-9]+' "$xml" | head -1)
              e=$(grep -oP 'errors="\K[0-9]+' "$xml" | head -1)
              TOTAL_T=$((TOTAL_T + ${t:-0}))
              FAILED=$((FAILED + ${f:-0}))
              SKIPPED=$((SKIPPED + ${s:-0}))
              ERRORS=$((ERRORS + ${e:-0}))
            done
            PASSED=$((TOTAL_T - FAILED - SKIPPED - ERRORS))
          fi

          # Exportar variables para otros pasos
          echo "TOTAL_T=$TOTAL_T" >> $GITHUB_ENV
          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED_TOTAL=$((FAILED + ERRORS))" >> $GITHUB_ENV

          STATUS="EXITOSO"
          COLOR="#27ae60"
          if [ $((FAILED + ERRORS)) -gt 0 ]; then
            STATUS="FALLIDO"
            COLOR="#e74c3c"
          fi

          cat > "$OUTPUT" << HTMLEOF
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <title>Reporte de Calidad — StudyHub</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; color: #333; }
              .badge { display: inline-block; padding: 6px 16px; border-radius: 4px; color: white; font-weight: bold; background: ${COLOR}; }
              .card { background: white; border-radius: 8px; padding: 20px 30px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.1); min-width: 120px; }
              .card .num { font-size: 32px; font-weight: bold; }
              table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; margin-top: 20px; }
              th { background: #2c3e50; color: white; padding: 10px; text-align: left; }
              td { padding: 9px; border-bottom: 1px solid #ecf0f1; }
            </style>
          </head>
          <body>
            <h1>Reporte de Calidad de Software — StudyHub</h1>
            <p>Estado Build: <span class="badge">${STATUS}</span> | Cobertura JaCoCo: <strong>${COVERAGE_STR}</strong></p>
            <div style="display:flex; gap:15px;">
              <div class="card"><div>${TOTAL_T}</div><div>Total Tests</div></div>
              <div class="card" style="color:#27ae60;"><div>${PASSED}</div><div>Éxito</div></div>
              <div class="card" style="color:#e74c3c;"><div>$((FAILED + ERRORS))</div><div>Fallas</div></div>
              <div class="card" style="color:#3498db;"><div>${COVERAGE_STR}</div><div>Cobertura</div></div>
            </div>
          </body>
          </html>
          HTMLEOF

      # Enviar Notificación a Telegram (Éxito)
      - name: Notificar éxito por Telegram
        if: success()
        run: |
          MSG="✅ *StudyHub Quality Pipeline*%0A%0A¡Build exitoso en la rama *${{ github.ref_name }}*!%0A%0A📊 *Métricas:*%0A• Cobertura: ${{ steps.coverage-summary.outputs.COVERAGE }}%0A• Tests: ${{ env.TOTAL_T }} (Exitosos: ${{ env.PASSED }})%0A%0ACommit: ${{ github.sha }}%0A[Ver Reporte](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "parse_mode=markdown"

      # Enviar Notificación a Telegram (Falla)
      - name: Notificar falla por Telegram
        if: failure()
        run: |
          MSG="❌ *StudyHub Quality Pipeline*%0A%0AEl build o los tests han FALLADO en la rama *${{ github.ref_name }}*.%0A%0A⚠️ *Posibles Causas:*%0A• Errores en pruebas unitarias.%0A• Cobertura inferior al 70%.%0A%0AFavor revisar los logs en GitHub Actions."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "parse_mode=markdown"

      # Subir reportes como artefactos
      - name: Subir artefactos de calidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-calidad-estatica
          path: |
            src/Back-end/target/reporte-pruebas.html
            src/Back-end/target/site/jacoco/
          retention-days: 30
