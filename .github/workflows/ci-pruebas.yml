name: CI - Pruebas Unitarias

on:
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    name: Ejecutar Pruebas Unitarias
    runs-on: ubuntu-22.04

    steps:
      # Obtener el código del repositorio
      - name: Checkout código
        uses: actions/checkout@v4

      # Configurar Java 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Correr las pruebas unitarias y verificar cobertura (JaCoCo check)
      - name: Ejecutar pruebas y verificar cobertura (70%)
        run: mvn clean verify --file src/Back-end/pom.xml --batch-mode --no-transfer-progress

      # Generar reporte HTML con los resultados (Surefire)
      - name: Generar reporte HTML Surefire
        if: always()
        run: mvn surefire-report:report --file src/Back-end/pom.xml --batch-mode --no-transfer-progress -DskipTests

      # Extraer métricas de cobertura de JaCoCo para el reporte
      - name: Extraer resumen de cobertura
        if: always()
        id: coverage-summary
        run: |
          JACOCO_XML="src/Back-end/target/site/jacoco/jacoco.xml"
          if [ -f "$JACOCO_XML" ]; then
            # Extraer Líneas
            LINE_MISSED=$(grep -oP 'counter type="LINE" missed="\K[0-9]+' "$JACOCO_XML" | tail -1)
            LINE_COVERED=$(grep -oP 'counter type="LINE" missed="[0-9]+" covered="\K[0-9]+' "$JACOCO_XML" | tail -1)
            TOTAL_LINES=$((LINE_MISSED + LINE_COVERED))
            PERCENTAGE=$(echo "scale=2; $LINE_COVERED * 100 / $TOTAL_LINES" | bc)
            
            # Extraer Complejidad Ciclomática
            CX_MISSED=$(grep -oP 'counter type="COMPLEXITY" missed="\K[0-9]+' "$JACOCO_XML" | tail -1)
            CX_COVERED=$(grep -oP 'counter type="COMPLEXITY" missed="[0-9]+" covered="\K[0-9]+' "$JACOCO_XML" | tail -1)
            TOTAL_CX=$((CX_MISSED + CX_COVERED))

            echo "COVERAGE=$PERCENTAGE%" >> $GITHUB_OUTPUT
            echo "COVERAGE_VAL=$PERCENTAGE" >> $GITHUB_OUTPUT
            echo "COMPLEXITY=$TOTAL_CX" >> $GITHUB_OUTPUT
          else
            echo "COVERAGE=N/A" >> $GITHUB_OUTPUT
            echo "COMPLEXITY=N/A" >> $GITHUB_OUTPUT
          fi

      # Construir reporte HTML enriquecido
      - name: Construir resumen HTML
        if: always()
        run: |
          REPORT_DIR="src/Back-end/target/surefire-reports"
          OUTPUT="src/Back-end/target/reporte-pruebas.html"
          COVERAGE_STR="${{ steps.coverage-summary.outputs.COVERAGE }}"

          TOTAL_T=0; PASSED=0; FAILED=0; SKIPPED=0; ERRORS=0

          if [ -d "$REPORT_DIR" ]; then
            for xml in "$REPORT_DIR"/TEST-*.xml; do
              [ -f "$xml" ] || continue
              t=$(grep -oP 'tests="\K[0-9]+' "$xml" | head -1)
              f=$(grep -oP 'failures="\K[0-9]+' "$xml" | head -1)
              s=$(grep -oP 'skipped="\K[0-9]+' "$xml" | head -1)
              e=$(grep -oP 'errors="\K[0-9]+' "$xml" | head -1)
              TOTAL_T=$((TOTAL_T + ${t:-0}))
              FAILED=$((FAILED + ${f:-0}))
              SKIPPED=$((SKIPPED + ${s:-0}))
              ERRORS=$((ERRORS + ${e:-0}))
            done
            PASSED=$((TOTAL_T - FAILED - SKIPPED - ERRORS))
          fi

          # Exportar variables para otros pasos
          echo "TOTAL_T=$TOTAL_T" >> $GITHUB_ENV
          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED_TOTAL=$((FAILED + ERRORS))" >> $GITHUB_ENV
          echo "CX_TOTAL=${{ steps.coverage-summary.outputs.COMPLEXITY }}" >> $GITHUB_ENV

          STATUS="EXITOSO"
          COLOR="#27ae60"
          if [ $((FAILED + ERRORS)) -gt 0 ]; then
            STATUS="FALLIDO"
            COLOR="#e74c3c"
          fi

          cat > "$OUTPUT" << HTMLEOF
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <title>Reporte de Calidad — StudyHub</title>
            <style>
              body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background: #f8f9fa; color: #333; line-height: 1.6; }
              .header { background: #2c3e50; color: white; padding: 30px; border-radius: 12px 12px 0 0; text-align: center; margin-bottom: 0; }
              .content { background: white; padding: 30px; border-radius: 0 0 12px 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
              .badge { display: inline-block; padding: 6px 16px; border-radius: 20px; color: white; font-weight: bold; background: ${COLOR}; font-size: 0.9em; }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
              .card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 25px; text-align: center; transition: transform 0.2s; }
              .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
              .card-title { color: #7f8c8d; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
              .card-value { font-size: 2.2em; font-weight: bold; color: #2c3e50; }
              table { width: 100%; border-collapse: collapse; margin-top: 30px; border-radius: 8px; overflow: hidden; }
              th { background: #f1f3f5; color: #495057; padding: 15px; text-align: left; font-size: 0.9em; }
              td { padding: 15px; border-bottom: 1px solid #eee; }
              tr:last-child td { border-bottom: none; }
              .footer { text-align: center; margin-top: 30px; color: #95a5a6; font-size: 0.85em; }
            </style>
          </head>
          <body>
            <div class="header">
              <h1>Reporte de Calidad de Software</h1>
              <p>Proyecto StudyHub | Rama: ${{ github.ref_name }}</p>
              <span class="badge">Estado: ${STATUS}</span>
            </div>
            <div class="content">
              <div class="grid">
                <div class="card"><div class="card-title">Cobertura JaCoCo</div><div class="card-value" style="color: #3498db;">${COVERAGE_STR}</div></div>
                <div class="card"><div class="card-title">Complejidad Total</div><div class="card-value">${{ steps.coverage-summary.outputs.COMPLEXITY }}</div></div>
                <div class="card"><div class="card-title">Tests Ejecutados</div><div class="card-value">${TOTAL_T}</div></div>
              </div>
              
              <h3>Resumen de Métricas</h3>
              <table>
                <thead>
                  <tr>
                    <th>Métrica</th>
                    <th>Valor Obtenido</th>
                    <th>Estado</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>Cobertura de Líneas</td>
                    <td><strong>${COVERAGE_STR}</strong></td>
                    <td>${STATUS} (Min 70%)</td>
                  </tr>
                  <tr>
                    <td>Pruebas Unitarias</td>
                    <td><strong>${PASSED} / ${TOTAL_T}</strong></td>
                    <td>$( [ "$FAILED" -eq 0 ] && echo "EXITOSO" || echo "CON FALLAS" )</td>
                  </tr>
                  <tr>
                    <td>Complejidad Ciclomática</td>
                    <td><strong>${{ steps.coverage-summary.outputs.COMPLEXITY }}</strong></td>
                    <td>Analizada</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="footer">
              Generado automáticamente por GitHub Actions | Commit: ${{ github.sha }}
            </div>
          </body>
          </html>
          HTMLEOF

      # Enviar Notificación a Telegram (Éxito)
      - name: Notificar éxito por Telegram
        if: success()
        run: |
          MSG="✅ *StudyHub Quality Pipeline*%0A%0A¡Build exitoso en la rama *${{ github.ref_name }}*!%0A%0A📊 *Métricas:*%0A• Cobertura: ${{ steps.coverage-summary.outputs.COVERAGE }}%0A• Tests: ${{ env.TOTAL_T }} (Exitosos: ${{ env.PASSED }})%0A%0ACommit: ${{ github.sha }}%0A[Ver Reporte](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "parse_mode=markdown"

      # Enviar Notificación a Telegram (Falla)
      - name: Notificar falla por Telegram
        if: failure()
        run: |
          MSG="❌ *StudyHub Quality Pipeline*%0A%0AEl build o los tests han FALLADO en la rama *${{ github.ref_name }}*.%0A%0A⚠️ *Posibles Causas:*%0A• Errores en pruebas unitarias.%0A• Cobertura inferior al 70%.%0A%0AFavor revisar los logs en GitHub Actions."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "parse_mode=markdown"

      # Subir reportes como artefactos
      - name: Subir artefactos de calidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-calidad-estatica
          path: |
            src/Back-end/target/reporte-pruebas.html
            src/Back-end/target/site/jacoco/
          retention-days: 30
