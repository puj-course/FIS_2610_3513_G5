name: Docker Image CI/CD

on:
  push:
    branches: [ "main", "Valeria" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studyhub-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/studyhub-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile_Front
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studyhub-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/studyhub-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
