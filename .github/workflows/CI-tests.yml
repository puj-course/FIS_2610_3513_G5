name: CI — Pruebas Unitarias StudyHub

on:
  push:
    branches: [ "main", "features-*", "feature-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Ejecutar Pruebas Unitarias
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Ejecutar pruebas con Maven
      run: mvn -B test --file src/Back-end/pom.xml

    - name: Generar reporte de cobertura JaCoCo
      if: always()
      run: mvn -B jacoco:report --file src/Back-end/pom.xml

    - name: Subir reportes de Surefire (resultados de pruebas)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: src/Back-end/target/surefire-reports/

    - name: Subir reporte de cobertura JaCoCo
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: src/Back-end/target/site/jacoco/

