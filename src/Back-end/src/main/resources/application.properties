# Configuración Exclusiva de PostgreSQL (Render)
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Configuración de subida de archivos ──────────────────────
# Habilita multipart/form-data
spring.servlet.multipart.enabled=true
# Tamaño máximo por archivo: 2 MB
spring.servlet.multipart.max-file-size=2MB
# Tamaño máximo de la solicitud completa: 2 MB
spring.servlet.multipart.max-request-size=2MB

# Carpeta local donde se guardan las fotos de perfil
app.upload.dir=uploads/fotos-perfil

# ── Configuración de Actuator ───────────────────────────────
# Expone el endpoint de salud públicamente para los healthchecks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# Manejo de headers de proxy (Render) para generacin de URLs dinmicas
server.forward-headers-strategy=FRAMEWORK
