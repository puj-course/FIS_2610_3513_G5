spring.datasource.url=jdbc:h2:file:./data/studyhub
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Configuración de subida de archivos ──────────────────────
# Habilita multipart/form-data
spring.servlet.multipart.enabled=true
# Tamaño máximo por archivo: 2 MB
spring.servlet.multipart.max-file-size=2MB
# Tamaño máximo de la solicitud completa: 2 MB
spring.servlet.multipart.max-request-size=2MB

# Carpeta local donde se guardan las fotos de perfil
app.upload.dir=uploads/fotos-perfil

# ── Configuración de Actuator ───────────────────────────────
# Expone el endpoint de salud públicamente para los healthchecks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always