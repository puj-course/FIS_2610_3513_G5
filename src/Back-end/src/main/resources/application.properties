# Configuración Exclusiva de PostgreSQL (Render)
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Resiliencia del Pool de Conexiones HikariCP (Supabase / Render / PgBouncer) ──
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=15000
spring.datasource.hikari.max-lifetime=55000
spring.datasource.hikari.keepalive-time=20000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.auto-commit=true

# ── FIX: "prepared statement already exists" con HikariCP + PostgreSQL ──
# prepareThreshold=0 desactiva el server-side prepared statement cache del driver
# así cada conexión del pool no colisiona con las del resto
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.connectTimeout=10

# ── Configuración de subida de archivos ──────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Carpeta local donde se guardan las fotos de perfil
app.upload.dir=uploads/fotos-perfil

# ── Configuración de Actuator ───────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
server.forward-headers-strategy=FRAMEWORK
server.port=${PORT:8080}

# ── Twilio Verify (envío de códigos OTP por SMS) ─────────────
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.verify.service.sid=${TWILIO_VERIFY_SID:}