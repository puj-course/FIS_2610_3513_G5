# Configuración de Base de Datos (Híbrida: H2 local / Postgres en Render)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/studyhub}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Consola H2 (solo útil en local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Configuración de subida de archivos ──────────────────────
# Habilita multipart/form-data
spring.servlet.multipart.enabled=true
# Tamaño máximo por archivo: 2 MB
spring.servlet.multipart.max-file-size=2MB
# Tamaño máximo de la solicitud completa: 2 MB
spring.servlet.multipart.max-request-size=2MB

# Carpeta local donde se guardan las fotos de perfil
app.upload.dir=uploads/fotos-perfil

# ── Configuración de Actuator ───────────────────────────────
# Expone el endpoint de salud públicamente para los healthchecks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always