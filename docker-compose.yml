version: "3.8"

services:
  # Servicio de Base de Datos Local (Opcional, para cumplir con la rúbrica de orquestación)
  db:
    image: postgres:15
    container_name: studyhub-db-local
    environment:
      POSTGRES_DB: studyhub
      POSTGRES_USER: studyhub_user
      POSTGRES_PASSWORD: studyhub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyhub_user -d studyhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio Backend (Java/Spring Boot)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyhub-backend
    ports:
      - "8080:8080"
    environment:
      # Conexión a Supabase
      - JDBC_DATABASE_URL=jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require
      - JDBC_DATABASE_USERNAME=postgres.nnnqjufyloqyehskvivw
      - JDBC_DATABASE_PASSWORD=Lalisam@1722!
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - PORT=8080
    volumes:
      - ./uploads:/app/uploads

  # Servicio Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile_Front
    container_name: studyhub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
