version: "3.8"

services:
  # Servicio de Base de Datos Local (Opcional, para cumplir con la rúbrica de orquestación)
  db:
    image: postgres:15
    container_name: studyhub-db-local
    environment:
      POSTGRES_DB: studyhub
      POSTGRES_USER: studyhub_user
      POSTGRES_PASSWORD: studyhub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyhub_user -d studyhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio Backend (Java/Spring Boot)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyhub-backend
    # Descomenta depends_on si usas la DB local
    # depends_on:
    #   db:
    #     condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Conexión a Base de Datos (Cambiar por credenciales de Render si se desea usar la externa)
      - JDBC_DATABASE_URL=jdbc:postgresql://db:5432/studyhub
      - JDBC_DATABASE_USERNAME=studyhub_user
      - JDBC_DATABASE_PASSWORD=studyhub_password
      - PORT=8080
    volumes:
      - ./uploads:/app/uploads

  # Servicio Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile_Front
    container_name: studyhub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
