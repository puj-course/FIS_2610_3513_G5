version: "3.8"

services:
  db:
    image: postgres:15
    container_name: studyhub-db-local
    environment:
      POSTGRES_DB: studyhub
      POSTGRES_USER: studyhub_user
      POSTGRES_PASSWORD: studyhub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyhub_user -d studyhub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studyhub-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyhub-backend
    ports:
      - "8080:8080"
    environment:
      - JDBC_DATABASE_URL=jdbc:postgresql://aws-1-us-east-2.pooler.6543/postgres?sslmode=require
      - JDBC_DATABASE_USERNAME=postgres.nnnqjufyloqyehskvivw
      - JDBC_DATABASE_PASSWORD=Lalisam@1722!
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - PORT=8080
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - studyhub-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile_Front
    container_name: studyhub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - studyhub-network

networks:
  studyhub-network:
    driver: bridge

volumes:
  postgres_data: