# ===== Configuración del servidor =====
server.port=8080

# ===== H2 Database (base de datos embebida) =====
# Modo archivo: los datos se guardan en ./data/studyhub_db y NO se pierden
spring.datasource.url=jdbc:h2:file:./data/studyhub_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== Consola Web de H2 =====
# Accesible en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
# update = crea/actualiza tablas automáticamente según las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

